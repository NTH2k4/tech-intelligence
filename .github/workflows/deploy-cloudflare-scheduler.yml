name: Deploy Cloudflare Daily Scheduler

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-daily-scheduler
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_WORKFLOW_DISPATCH_TOKEN: ${{ secrets.GITHUB_WORKFLOW_DISPATCH_TOKEN }}
        run: |
          set -Eeuo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GITHUB_WORKFLOW_DISPATCH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret or variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Deploy Worker and Cron Trigger
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.156.2 deploy             --config cloudflare/scheduler/wrangler.jsonc

      - name: Store GitHub dispatch token as a Cloudflare Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_WORKFLOW_DISPATCH_TOKEN: ${{ secrets.GITHUB_WORKFLOW_DISPATCH_TOKEN }}
        run: |
          set +x
          printf '%s' "$GITHUB_WORKFLOW_DISPATCH_TOKEN" |
            npx --yes wrangler@4.156.2 secret put GITHUB_TOKEN               --config cloudflare/scheduler/wrangler.jsonc
